[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="ai-agent-reliability-resilience"
version="0.2.0"
description="AI agent reliability engineering, MCP chaos testing, transaction recovery, SRE metrics, and operational resilience"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Ahmed Hassan"}]
keywords=["AI agent reliability","agentic AI reliability","MCP testing","chaos engineering","AgentOps","AI SRE","operational resilience"]
classifiers=["Programming Language :: Python :: 3","License :: OSI Approved :: MIT License","Topic :: System :: Monitoring"]

[project.scripts]
agentresilience="agentresilience.cli:main"

[tool.setuptools.packages.find]
include=["agentresilience*"]
