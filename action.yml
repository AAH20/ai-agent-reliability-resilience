name: AgentResilience
description: Run an AI agent reliability experiment and export machine-readable evidence
inputs:
  experiment:
    description: Path to an AgentResilience experiment JSON file
    required: true
  output:
    description: Path for the JSON report
    required: false
    default: agent-resilience-report.json
runs:
  using: composite
  steps:
    - name: Install AgentResilience
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Run resilience experiment
      shell: bash
      run: |
        agentresilience run "${{ inputs.experiment }}" \
          --output "${{ inputs.output }}" \
          --junit agent-resilience-junit.xml \
          --sarif agent-resilience.sarif \
          --brief agent-resilience.md
