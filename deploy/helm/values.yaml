image:
  repository: ghcr.io/aah20/ai-agent-reliability-resilience
  tag: latest
  pullPolicy: IfNotPresent

schedule: "0 6 * * *"
experiment: experiments/refund-partial-success.json
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault
